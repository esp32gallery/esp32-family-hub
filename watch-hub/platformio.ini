; Family Hub — M5Stack StopWatch (SKU C152) 版
; 构建: PLATFORMIO_CORE_DIR=$PWD/.pio-core .pio-venv/bin/pio run -e stopwatch
[env:stopwatch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -I src
  -D BOARD_M5STOPWATCH
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  https://github.com/m5stack/M5Unified.git
  https://github.com/m5stack/M5PM1.git
  https://github.com/m5stack/M5IOE1.git
  bblanchon/ArduinoJson@7.4.2
  tzapu/WiFiManager@2.0.17

[env:stopwatch-test]
extends = env:stopwatch
build_flags = ${env:stopwatch.build_flags} -D SW_SELFTEST=1
