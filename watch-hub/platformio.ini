; Family Hub — M5Stack StopWatch (SKU C152)
;   pio run -e stopwatch
; Wi-Fi credentials live in src/private-config.h (gitignored).
; src/private-config.example.h is the template; the build succeeds without it.
[env:stopwatch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -I src
  -D BOARD_M5STOPWATCH
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=0
lib_deps =
  https://github.com/m5stack/M5Unified.git
  tzapu/WiFiManager@2.0.17

[env:stopwatch-test]
extends = env:stopwatch
build_flags = ${env:stopwatch.build_flags} -D SW_SELFTEST=1
