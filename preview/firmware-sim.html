<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家庭小站 · 固件画面预览</title>
<style>body{font:17px system-ui;background:#fff4dc;color:#26332c;margin:24px auto;max-width:850px;padding:0 12px}canvas{width:min(100%,480px);height:auto;border-radius:32px;display:block;background:#000}button,select{font:inherit;padding:12px 18px;border-radius:16px;border:1px solid #b4bca8;background:white;margin:12px 6px 12px 0}#strip{display:flex;overflow:auto;gap:8px}#strip img{width:144px;border-radius:12px}p{line-height:1.6}img.font{width:480px;max-width:100%}</style>
<h1>家庭小站 · 固件画面预览</h1><canvas width="480" height="480" id="screen"></canvas>
<button id="roll">抛骰子</button><label>落点 <select id="target"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label><button id="step">逐帧</button>
<p id="status">加载中</p><div id="strip"></div><p>姿态、RGB565 颜色、缩放、抛起位移均由固件共享的 C++ 代码生成。这里只预览画面和节奏，不能模拟触摸芯片、显示总线时序或扬声器听感。</p><h2>原生字体样张</h2><img class="font" src="font-native.png" alt="32和40像素简体中文Medium字重原生字形">
<script>
const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),status=document.querySelector('#status'),strip=document.querySelector('#strip');let value=1,seq=[],at=0,busy=false;
async function prepare(){const to=+document.querySelector('#target').value;seq=await Promise.all(Array.from({length:13},(_,i)=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=`frames/${value}-${to}-${String(i).padStart(2,'0')}.png`})));strip.replaceChildren(...seq.map((im,i)=>{const thumb=im.cloneNode();thumb.title=`第${i}帧`;thumb.onclick=()=>show(i);return thumb}));at=0;show(0);return to}
function show(i){at=i;ctx.drawImage(seq[i],0,0);status.textContent=`第 ${i}/12 帧`}
document.querySelector('#roll').onclick=async()=>{if(busy)return;busy=true;try{const to=await prepare(),start=performance.now();for(let i=1;i<=12;i++){await new Promise(r=>setTimeout(r,Math.max(0,start+i*80-performance.now())));show(i)}value=to;status.textContent=`落点 ${to} · ${Math.round(performance.now()-start)} 毫秒`}finally{busy=false}};
document.querySelector('#step').onclick=()=>{if(!busy)show((at+1)%13)};document.querySelector('#target').onchange=()=>prepare();prepare().catch(()=>status.textContent='先运行 README 中的预览生成命令');
</script></html>
